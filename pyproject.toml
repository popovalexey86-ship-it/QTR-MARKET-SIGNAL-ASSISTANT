[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-assistant"
version = "0.1.0"
description = "Multi-asset market signal screener with explainable noise filtering"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
websocket = ["pybit>=5.11,<6"]
web = []
telegram = ["python-telegram-bot>=22.8,<23"]
all = ["pybit>=5.11,<6", "python-telegram-bot>=22.8,<23"]

[project.scripts]
market-screener = "market_signal_assistant.cli:main"
market-signal-cli = "market_signal_assistant.cli:main"
market-signal-web = "market_signal_assistant.web.app:main"
market-signal-telegram = "market_signal_assistant.telegram.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
