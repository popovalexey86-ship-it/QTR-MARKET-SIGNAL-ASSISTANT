name: QTR recovery startup order CI

on:
  push:
    branches:
      - fix/qtr-micro-recovery-startup-order

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,telegram]" pytest mypy ruff
      - name: Pytest
        run: pytest
      - name: Mypy
        run: mypy src
      - name: Ruff
        run: ruff check .
