name: QTR Trader V1 CI

on:
  push:
    branches:
      - feature/qtr-trader-telegram-routing

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[telegram]"
          pip install pytest mypy ruff
      - name: Pytest
        run: pytest
      - name: Mypy
        run: mypy src
      - name: Ruff
        run: ruff check .
